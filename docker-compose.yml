services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netcapacity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-netcapacity}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-netcapacity}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-locally}
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build: ./services
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://netcapacity:change-me-locally@db:5432/netcapacity}
    depends_on:
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  collector:
    build: ./services
    command: python collector.py
    environment:
      AMQP_URL: ${AMQP_URL:-amqp://netcapacity:change-me-locally@rabbitmq:5672/%2F}
      COLLECTION_MODE: ${COLLECTION_MODE:-simulated}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-20}
      SIMULATED_DEVICES: ${SIMULATED_DEVICES:-8}
    depends_on:
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  processor:
    build: ./services
    command: python processor.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://netcapacity:change-me-locally@db:5432/netcapacity}
      AMQP_URL: ${AMQP_URL:-amqp://netcapacity:change-me-locally@rabbitmq:5672/%2F}
      ALERT_THRESHOLD_PERCENT: ${ALERT_THRESHOLD_PERCENT:-80}
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on: [api]
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
volumes:
  pgdata:
