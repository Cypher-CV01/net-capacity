# Containers de cada instância da APLICAÇÃO (Auto Scaling Group atrás do ALB).
# Todas as instâncias são iguais e sem estado: o estado fica no RDS e na fila SQS.
# Uso: docker compose -f deploy/docker-compose.app.yml --env-file .env up -d --build
name: netcapacity

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  frontend:                       # React servido por Nginx; faz proxy de /api para a API
    build: ../frontend
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  api:                            # FastAPI: /health, /api/*, /metrics
    build: ../services
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --proxy-headers
    environment:
      SERVICE_NAME: api
      DATABASE_URL: ${DATABASE_URL}
      ALERT_THRESHOLD_PERCENT: ${ALERT_THRESHOLD_PERCENT:-80}
      INSTANCE_ID: ${INSTANCE_ID}
    ports: ["8000:8000"]          # métricas para o Prometheus (porta liberada só para a instância ops)
    restart: unless-stopped
    logging: *logging

  processor:                      # consome a fila SQS e grava no RDS (consumidor concorrente)
    build: ../services
    command: python processor.py
    environment:
      SERVICE_NAME: processor
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_BACKEND: sqs
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION}
      ALERT_THRESHOLD_PERCENT: ${ALERT_THRESHOLD_PERCENT:-80}
      METRICS_PORT: "9101"
    ports: ["9101:9101"]
    restart: unless-stopped
    logging: *logging

  # ---------- Agentes de observabilidade ----------
  node-exporter:                  # métricas da instância: CPU, memória, disco, rede
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    ports: ["9100:9100"]
    restart: unless-stopped
    logging: *logging

  cadvisor:                       # métricas por container
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: ["8080:8080"]
    restart: unless-stopped
    logging: *logging

  promtail:                       # envia os logs de todos os containers para o Loki
    image: grafana/promtail:3.0.0
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: ${LOKI_URL}
      INSTANCE_ID: ${INSTANCE_ID}
      HOST_ROLE: app
    volumes:
      - ../observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *logging
