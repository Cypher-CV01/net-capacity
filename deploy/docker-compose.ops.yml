# Containers da instância de OPERAÇÃO: coletor e stack de observabilidade.
# Uso: docker compose -f deploy/docker-compose.ops.yml --env-file .env up -d --build
name: netcapacity-ops

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  collector:                      # produtor: publica amostras dos uplinks na fila SQS
    build: ../services
    command: python collector.py
    environment:
      SERVICE_NAME: collector
      QUEUE_BACKEND: sqs
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION}
      COLLECTION_MODE: simulated
      SIMULATED_DEVICES: ${SIMULATED_DEVICES:-40}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      METRICS_PORT: "9102"
    restart: unless-stopped
    logging: *logging

  prometheus:                     # coleta e guarda as métricas (descobre as instâncias pela API da EC2)
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]  # sem acesso pela internet
    restart: unless-stopped
    logging: *logging

  loki:                           # guarda os logs de todas as instâncias
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]          # liberada no security group só para as instâncias da aplicação
    restart: unless-stopped
    logging: *logging

  promtail:                       # logs dos containers desta instância
    image: grafana/promtail:3.0.0
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: http://loki:3100
      INSTANCE_ID: ${INSTANCE_ID}
      HOST_ROLE: ops
    volumes:
      - ../observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes: ["/:/host:ro,rslave"]
    restart: unless-stopped
    logging: *logging

  grafana:                        # dashboards (datasources e painéis provisionados como código)
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/netcapacity-capacidade.json
      RDS_HOST: ${RDS_HOST}
      RDS_USER: ${RDS_USER}
      RDS_PASSWORD: ${RDS_PASSWORD}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]
    restart: unless-stopped
    logging: *logging

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
